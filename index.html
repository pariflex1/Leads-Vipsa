<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .auth-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div id="authScreen" class="fixed inset-0 z-[100] auth-gradient flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-fingerprint text-3xl"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">Secure Access</h2>
                <p class="text-slate-400 text-sm">Enter credentials to continue</p>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="userInp" placeholder="Username" class="w-full p-4 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="pinInp" placeholder="4-Digit PIN" maxlength="4" class="w-full p-4 rounded-2xl bg-slate-100 text-center text-2xl tracking-widest border-none focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="loginWithPin()" id="loginBtn" class="w-full py-4 rounded-2xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                    Verify PIN
                </button>
                
                <div id="passkeySection" class="hidden">
                    <div class="relative py-4 flex items-center"><div class="flex-grow border-t border-slate-200"></div><span class="px-3 text-[10px] text-slate-400 font-bold uppercase">Or</span><div class="flex-grow border-t border-slate-200"></div></div>
                    <button onclick="loginWithPasskey()" class="w-full py-4 rounded-2xl border-2 border-slate-200 text-slate-700 font-bold flex items-center justify-center gap-2 hover:bg-slate-50 transition">
                        <i class="fa-solid fa-face-smile text-blue-500"></i> Use Passkey
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden opacity-0 transition-opacity duration-500">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <header class="sticky top-0 z-40 pb-6 bg-slate-50/90 backdrop-blur-md">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pt-2">
                    <div>
                        <h1 class="text-2xl font-black text-slate-800 tracking-tight uppercase">Lead Grid</h1>
                        <p id="welcomeUser" class="text-xs text-slate-500 font-medium italic"></p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="relative w-full md:w-96">
                            <input type="text" id="searchInput" oninput="handleSearch()" 
                                   placeholder="Search by name, city, budget..." 
                                   class="w-full pl-11 pr-4 py-3.5 rounded-2xl border-none shadow-lg focus:ring-2 focus:ring-blue-500 bg-white transition-all">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        </div>
                        <button onclick="logout()" class="w-12 h-12 flex items-center justify-center bg-white text-slate-400 rounded-2xl hover:text-red-500 transition shadow-lg">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div id="loader" class="flex flex-col items-center justify-center py-32">
                <div class="animate-spin rounded-full h-10 w-10 border-[3px] border-slate-200 border-t-blue-600"></div>
                <p class="mt-4 text-slate-400 text-sm font-medium animate-pulse">Fetching leads...</p>
            </div>

            <div id="leadGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            
            <div id="emptyState" class="hidden text-center py-20">
                <i class="fa-solid fa-box-open text-4xl text-slate-200 mb-4"></i>
                <p class="text-slate-500">No leads found matching your search.</p>
            </div>
        </div>

        <a href="http://lead.jhansiproperty.com/form" class="fixed bottom-8 right-8 w-16 h-16 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center text-3xl hover:scale-110 active:scale-95 transition-all z-50">
            <i class="fa-solid fa-plus"></i>
        </a>
    </div>

    <div id="leadModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeOnBackdrop(event)">
        <div class="bg-white rounded-[2rem] w-full max-w-xl max-h-[85vh] overflow-hidden shadow-2xl flex flex-col" id="modalContainer">
            <div class="overflow-y-auto custom-scroll p-8" id="modalContent"></div>
        </div>
    </div>

    <script>
        /* --- CONFIGURATION --- */
        const API_KEY = 'AIzaSyAN_kshpoKprIZXZMCS-K--RTh-oNjsvGU';
        const SHEET_ID = '1f9VbQmzjyKXIdX49Aej-JEi8CLb1jx6UENVAV1BcbWc';
        const USERS_RANGE = 'Users!A2:D';
        const LEADS_RANGE = 'Leads!A2:P';
        const SEARCH_COLUMNS = ['Name', 'Contact', 'City', 'Profession', 'Status', 'Project', 'PropertyType', 'Budget', 'LocationPrefer'];

        let rawLeads = [];

        window.onload = () => {
            if (localStorage.getItem('isAuth') === 'true') {
                document.getElementById('passkeySection').classList.remove('hidden');
            }
        };

        /* --- AUTH LOGIC --- */
        async function loginWithPin() {
            const u = document.getElementById('userInp').value.trim();
            const p = document.getElementById('pinInp').value.trim();
            if(!u || !p) return alert("Enter Username and PIN");

            const btn = document.getElementById('loginBtn');
            btn.innerText = "Checking...";

            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${USERS_RANGE}?key=${API_KEY}`;
                const res = await fetch(url).then(r => r.json());
                const rows = res.values || [];
                const match = rows.find(r => String(r[0]).trim() === u && String(r[1]).trim() === p);

                if (match) {
                    localStorage.setItem('isAuth', 'true');
                    localStorage.setItem('displayName', match[2]);
                    enterApp(match[2]);
                } else {
                    alert("Invalid PIN or Username");
                    btn.innerText = "Verify PIN";
                }
            } catch (e) {
                alert("Login Error: Check API Key and Sheet Sharing (set to 'Anyone with link')");
                btn.innerText = "Verify PIN";
            }
        }

        function loginWithPasskey() {
            if (localStorage.getItem('isAuth') === 'true') {
                enterApp(localStorage.getItem('displayName'));
            }
        }

        function enterApp(name) {
            document.getElementById('authScreen').classList.add('hidden');
            const app = document.getElementById('mainApp');
            app.classList.remove('hidden');
            setTimeout(() => app.classList.add('opacity-100'), 50);
            document.getElementById('welcomeUser').innerText = `Logged in as: ${name}`;
            loadLeads();
        }

        /* --- DATA FETCHING & RENDERING --- */
        async function loadLeads() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${LEADS_RANGE}?key=${API_KEY}`;
                const res = await fetch(url).then(r => r.json());
                const headers = ['Timestamp', 'Name', 'Contact', 'City', 'Profession', 'Email', 'Status', 'Note', 'Project', 'PropertyType', 'Budget', 'LocationPrefer', 'FollowUp', 'User', 'UContact', 'ClientImageUrl'];
                
                rawLeads = res.values.map(row => {
                    let obj = {};
                    headers.forEach((h, i) => obj[h] = row[i] || '');
                    return obj;
                });
                renderGrid(rawLeads);
            } catch (err) { console.error(err); }
            document.getElementById('loader').classList.add('hidden');
        }

        function renderGrid(leads) {
            const grid = document.getElementById('leadGrid');
            const empty = document.getElementById('emptyState');
            
            if (leads.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            grid.innerHTML = leads.map((lead, index) => `
                <div onclick="openModal(${index})" class="bg-white p-6 rounded-3xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer border border-slate-100 group">
                    <div class="flex items-center gap-4 mb-5">
                        <div class="relative">
                            <img src="${lead.ClientImageUrl || 'https://ui-avatars.com/api/?background=random&name='+lead.Name}" class="w-14 h-14 rounded-2xl object-cover ring-4 ring-slate-50">
                            <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-white ${getStatusColor(lead.Status)}"></span>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg group-hover:text-blue-600 transition-colors">${lead.Name || 'Unnamed'}</h3>
                            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">${lead.Profession || 'General'}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-[11px] font-bold">
                        <div class="bg-slate-50 text-slate-500 px-3 py-2 rounded-xl flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-blue-400"></i> ${lead.City || 'N/A'}
                        </div>
                        <div class="bg-slate-50 text-slate-500 px-3 py-2 rounded-xl flex items-center gap-2">
                            <i class="fa-solid fa-clock text-orange-400"></i> ${lead.Status || 'New'}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getStatusColor(status) {
            const s = String(status).toLowerCase();
            if (s.includes('hot')) return 'bg-red-500';
            if (s.includes('success') || s.includes('won')) return 'bg-green-500';
            return 'bg-blue-500';
        }

        function handleSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = rawLeads.filter(lead => 
                SEARCH_COLUMNS.some(key => {
                    const value = lead[key];
                    return value && String(value).toLowerCase().includes(term);
                })
            );
            renderGrid(filtered);
        }

        function openModal(index) {
            const lead = rawLeads[index];
            const cleanPhone = String(lead.Contact || '').replace(/\D/g, '');
            
            document.getElementById('modalContent').innerHTML = `
                <div class="flex justify-between items-center mb-8">
                    <div class="flex items-center gap-4">
                        <img src="${lead.ClientImageUrl || 'https://ui-avatars.com/api/?name='+lead.Name}" class="w-16 h-16 rounded-2xl object-cover shadow-md">
                        <div>
                            <h2 class="text-2xl font-black text-slate-800">${lead.Name}</h2>
                            <p class="text-blue-600 font-bold text-xs uppercase">${lead.Profession}</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    ${Object.entries(lead).map(([key, val]) => `
                        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <label class="block text-slate-400 text-[10px] uppercase font-black mb-1">${key.replace(/([A-Z])/g, ' $1')}</label>
                            <span class="text-slate-700 font-semibold text-sm">${val || '-'}</span>
                        </div>
                    `).join('')}
                </div>

                <div class="grid grid-cols-4 gap-3">
                    <a href="tel:${cleanPhone}" class="flex flex-col items-center p-4 bg-blue-50 text-blue-600 rounded-2xl hover:bg-blue-600 hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-phone text-lg mb-2"></i><span class="text-[10px] font-black uppercase">Call</span>
                    </a>
                    <a href="https://wa.me/91${cleanPhone}" target="_blank" class="flex flex-col items-center p-4 bg-emerald-50 text-emerald-600 rounded-2xl hover:bg-emerald-600 hover:text-white transition-all shadow-sm">
                        <i class="fa-brands fa-whatsapp text-lg mb-2"></i><span class="text-[10px] font-black uppercase">WA</span>
                    </a>
                    <a href="mailto:${lead.Email}" class="flex flex-col items-center p-4 bg-indigo-50 text-indigo-600 rounded-2xl hover:bg-indigo-600 hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-envelope text-lg mb-2"></i><span class="text-[10px] font-black uppercase">Mail</span>
                    </a>
                    <a href="sms:${cleanPhone}" class="flex flex-col items-center p-4 bg-slate-100 text-slate-600 rounded-2xl hover:bg-slate-600 hover:text-white transition-all shadow-sm">
                        <i class="fa-solid fa-comment text-lg mb-2"></i><span class="text-[10px] font-black uppercase">SMS</span>
                    </a>
                </div>
            `;
            document.getElementById('leadModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('leadModal').classList.add('hidden'); }
        function closeOnBackdrop(e) { if (e.target.id === 'leadModal') closeModal(); }
        function logout() { localStorage.removeItem('isAuth'); location.reload(); }
    </script>
</body>
</html>
